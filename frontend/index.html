<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiropay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="login-container">
    <h2>Login</h2>
    <input type="email" id="login-email" placeholder="Email">
    <input type="password" id="login-password" placeholder="Password">
    <button id="login-btn">Sign In</button>
  </div>

  <div id="signup-container">
    <h2>Sign Up</h2>
    <input type="text" id="signup-name" placeholder="Name">
    <input type="text" id="signup-family" placeholder="Family Name">
    <input type="email" id="signup-email" placeholder="Email">
    <input type="password" id="signup-password" placeholder="Password">
    <button id="signup-btn">Sign Up</button>
  </div>

  <div id="dashboard" style="display:none;">
    <div id="card">
      <img src="images/default.jpg" alt="Card Image" id="card-image">
      <h3 id="card-name"></h3>
      <h4 id="card-family"></h4>
      <p>Balance: <span id="card-balance">0</span></p>
    </div>
    <button id="logout-btn">Logout</button>
    <div id="admin-actions" style="display:none;">
      <h3>Admin Panel</h3>
      <input type="number" id="admin-user-id" placeholder="User ID">
      <input type="number" id="admin-amount" placeholder="Amount">
      <button id="add-balance-btn">Add Balance</button>
      <button id="remove-balance-btn">Remove Balance</button>
      <button id="delete-user-btn">Delete User</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
