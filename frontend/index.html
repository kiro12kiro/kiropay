<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiropay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Kiropay</h1>

    <div id="auth">
      <input type="email" id="email" placeholder="البريد الإلكتروني">
      <input type="password" id="password" placeholder="كلمة المرور">
      <button id="loginBtn">تسجيل دخول</button>
      <button id="signupBtn">إنشاء حساب</button>
    </div>

    <div id="userPanel" style="display:none;">
      <div class="card">
        <img src="images/default.jpg" alt="Card Image" class="card-img">
        <h2 id="userName">اسم المستخدم</h2>
        <h3 id="userFamily">اسم الأسرة</h3>
        <p>الرصيد: <span id="balance">0</span></p>
      </div>
      <button id="logoutBtn">تسجيل خروج</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
