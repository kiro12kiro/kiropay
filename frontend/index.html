<!DOCTYPE html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kiropay Dashboard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Kiropay 💳</h1>

      <div id="status">جارِ تحميل البيانات...</div>

      <div class="actions">
        <input type="text" id="search" placeholder="ابحث عن مستخدم..." />
        <button id="refresh">تحديث 🔄</button>
      </div>

      <div id="users"></div>

      <h2>إدارة المستخدمين</h2>
      <div class="form-group">
        <input type="text" id="name" placeholder="اسم المستخدم" />
        <input type="number" id="balance" placeholder="الرصيد" />
        <button id="create">➕ إنشاء حساب</button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
