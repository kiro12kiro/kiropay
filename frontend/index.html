<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kiropay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="container">
    <h1>Kiropay</h1>
    
    <div id="login-section">
      <input type="email" id="login-email" placeholder="Email">
      <input type="password" id="login-password" placeholder="Password">
      <button id="login-btn">تسجيل دخول</button>
    </div>

    <div id="signup-section">
      <input type="text" id="signup-name" placeholder="الاسم">
      <input type="text" id="signup-family" placeholder="اسم الاسرة">
      <input type="email" id="signup-email" placeholder="Email">
      <input type="password" id="signup-password" placeholder="Password">
      <input type="file" id="signup-image">
      <button id="signup-btn">انشاء حساب</button>
    </div>

    <div id="dashboard" style="display:none;">
      <div id="card">
        <img id="card-img" src="images/default.jpg">
        <h2 id="card-name"></h2>
        <h3 id="card-family"></h3>
        <p id="card-balance"></p>
      </div>
      <button id="logout-btn">تسجيل خروج</button>
      <div id="admin-actions" style="display:none;">
        <input type="text" id="search-name" placeholder="ابحث عن مستخدم">
        <button id="search-btn">بحث</button>
        <input type="number" id="add-balance-amount" placeholder="اضف رصيد">
        <button id="add-balance-btn">اضافة رصيد</button>
        <button id="delete-user-btn">حذف مستخدم</button>
      </div>
    </div>

    <div id="message"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
