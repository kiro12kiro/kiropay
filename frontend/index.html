<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kiropay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Kiropay</h1>
    <div id="auth">
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="Password">
      <button id="loginBtn">تسجيل دخول</button>
      <button id="signupBtn">إنشاء حساب</button>
    </div>

    <div id="dashboard" style="display:none;">
      <div class="card">
        <img id="cardImage" src="images/default.jpg">
        <div class="card-info">
          <h2 id="cardName"></h2>
          <p>الرصيد: <span id="balance"></span></p>
        </div>
        <button id="logoutBtn">تسجيل خروج</button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
