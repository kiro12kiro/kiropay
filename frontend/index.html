<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiropay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Kiropay</h1>

    <div id="signup-login">
      <input type="text" id="name" placeholder="اسم المستخدم">
      <input type="text" id="family_name" placeholder="اسم الأسرة">
      <input type="email" id="email" placeholder="الإيميل">
      <input type="password" id="password" placeholder="كلمة المرور">
      <button id="signup-btn">إنشاء حساب</button>
      <button id="login-btn">تسجيل دخول</button>
    </div>

    <div id="dashboard" style="display:none;">
      <div class="visa-card">
        <img src="images/default.jpg" alt="Visa" id="card-image">
        <h2 id="card-name"></h2>
        <h3 id="card-family"></h3>
        <p id="card-balance"></p>
      </div>
      <button id="logout-btn">تسجيل خروج</button>
      <div id="admin-controls" style="display:none;">
        <input type="text" id="search-user" placeholder="ابحث عن مستخدم">
        <button id="search-btn">بحث</button>
        <input type="number" id="amount" placeholder="المبلغ">
        <button id="add-balance-btn">إضافة رصيد</button>
        <button id="remove-balance-btn">حذف رصيد</button>
        <button id="delete-user-btn">حذف مستخدم</button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
