<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>Kiropay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="auth-section">
    <h2>Kiropay</h2>
    <input type="email" id="email" placeholder="الإيميل">
    <input type="password" id="password" placeholder="كلمة المرور">
    <button id="loginBtn">تسجيل دخول</button>
    <button id="signupBtn">إنشاء حساب</button>
  </div>

  <div id="dashboard" style="display:none;">
    <h2>لوحة التحكم</h2>
    <p>المستخدم: <span id="userName"></span></p>
    <p>اسم الأسرة: <span id="familyName"></span></p>
    <p>الرصيد: <span id="balance"></span></p>

    <div id="adminActions" style="display:none;">
      <select id="userSelect"></select>
      <button id="addBalanceBtn">إضافة رصيد</button>
      <button id="removeBalanceBtn">سحب رصيد</button>
      <button id="deleteUserBtn">حذف مستخدم</button>
    </div>

    <button id="logoutBtn">تسجيل خروج</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
