<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiropay</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>Kiropay</h1>

  <div id="login-form">
    <h2>تسجيل دخول</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button id="login-btn">تسجيل دخول</button>
  </div>

  <div id="register-form">
    <h2>انشاء حساب</h2>
    <input type="text" id="name" placeholder="الاسم">
    <input type="text" id="family_name" placeholder="اسم العائلة">
    <input type="email" id="reg-email" placeholder="Email">
    <input type="password" id="reg-password" placeholder="Password">
    <button id="register-btn">انشاء حساب</button>
  </div>

  <div id="user-dashboard" style="display:none;">
    <h2 id="user-name"></h2>
    <p>الرصيد: <span id="user-balance"></span></p>
    <button id="logout-btn">تسجيل خروج</button>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
