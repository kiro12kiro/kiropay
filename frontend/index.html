<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kiropay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="login-form">
    <h2>تسجيل دخول</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button id="login-btn">تسجيل دخول</button>
  </div>

  <div id="signup-form">
    <h2>إنشاء حساب</h2>
    <input type="text" id="name" placeholder="الاسم الأول">
    <input type="text" id="family" placeholder="اسم العائلة">
    <input type="email" id="signup-email" placeholder="Email">
    <input type="password" id="signup-password" placeholder="Password">
    <input type="file" id="image">
    <button id="signup-btn">إنشاء حساب</button>
  </div>

  <div id="dashboard">
    <div id="card">
      <img id="card-image" src="images/default.jpg" alt="Card">
      <h3 id="card-name"></h3>
      <h4 id="card-family"></h4>
      <p id="balance">الرصيد: </p>
    </div>
    <button id="logout-btn">تسجيل خروج</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
